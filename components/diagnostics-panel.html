<div class="panel-header">
    <h2>Match History & Analysis</h2>
</div>
<div class="panel-body">
    <!-- MOVES LOG -->
    <div class="control-group logs-group">
        <div class="logs-header">
            <h3 id="logs-header-title">Match History</h3>
            <div class="logs-header-right">
                <button class="btn-export-state" id="btn-export-state" title="Export game state summary & JSON">
                    <span class="export-icon">⤓</span> Export
                </button>
                <span id="history-counter" class="history-step-badge">Start</span>
            </div>
        </div>
        <div class="history-controls-bar">
            <button class="hist-btn" id="btn-history-first" title="Jump to Start (First Move)">⏮</button>
            <button class="hist-btn" id="btn-history-prev" title="Step Backward (Left Arrow)">◀</button>
            <button class="hist-btn" id="btn-history-next" title="Step Forward (Right Arrow)">▶</button>
            <button class="hist-btn" id="btn-history-latest" title="Jump to Latest State">⏭</button>
        </div>
        <div class="blunder-detail-panel hidden" id="history-blunder-detail">
            <!-- Populated dynamically when clicking a move with analysis -->
        </div>
        <div class="logs-container" id="game-logs">
            <!-- Populated dynamically with formal move notation only -->
        </div>
    </div>
</div>
