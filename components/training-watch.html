<div class="tw-banner hidden" id="training-watch-overlay">
    <div class="tw-banner-content">
        <div class="tw-banner-status">
            <span class="tw-live-dot" id="tw-live-dot"></span>
            <span class="tw-banner-title">Live Training Mode</span>
            <span class="tw-status-badge" id="tw-status-badge">Waiting...</span>
        </div>
        <div class="tw-banner-stats">
            <span class="tw-banner-stat">Move: <strong id="tw-move-count">0</strong></span>
            <span class="tw-banner-stat">Last Play: <strong id="tw-last-move">—</strong></span>
        </div>
        <button class="btn btn-accent btn-sm" id="tw-close-btn">Stop Watching</button>
    </div>
</div>
